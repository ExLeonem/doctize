project:
  name: Doctize
  tagline: Documentation sites from the Javadoc of your annotated code and a folder of Markdown.
  version: 0.1.0
  repository: https://github.com/ExLeonem/doctize
  footer: This site was generated by Doctize itself, from the Javadoc of its own source code and the Markdown in doctize-docs/docs.

guides: docs

sections:
  - id: quick-start
    title: Quick start
    description: Document a library and generate a site in ten minutes.
  - id: setup
    title: Setup
    description: Installing, running and configuring Doctize.
  - id: guides
    title: Guides
    description: Writing documentation, structuring the site, changing its look, extending Doctize.
  - id: api
    title: API Reference
    description: The annotations and the public API of the generator, generated from the Javadoc.

# Published with GitHub Pages. The address, https://exleonem.github.io/doctize/, is derived from project.repository.
hosting:
  githubPages: true
