project:
  name: Doctize
  tagline: Documentation sites from the Javadoc of your annotated code and a folder of Markdown.
  version: 0.1.0
  repository: https://github.com/ExLeonem/doctize
  footer: This site was generated by Doctize itself, from the Javadoc of its own source code and the Markdown in doctize-docs/docs.

guides: docs

sections:
  - id: quick-start
    title: Quick start
    description: Document a library and generate a site in ten minutes.
  - id: setup
    title: Setup
    description: Installing, running and configuring Doctize.
  - id: guides
    title: Guides
    description: Writing documentation, structuring the site, changing its look, extending Doctize.
  - id: architecture
    title: Architecture
    description: How Doctize is put together, and the diagrams that Doctize draws of its own code.
  - id: api
    title: API Reference
    description: The annotations and the public API of the generator, generated from the Javadoc.

# The architecture diagrams are a Pro feature. The build switches them on when it finds a license (see build.gradle.kts), so `enabled`
# stays false here: without a license the site is built without these pages, and without a warning. With one, the section "Architecture"
# gets the overview of the packages of all modules, class diagrams of the types that matter, and the flow charts of the main flows.
#
# Not used, because Doctize has nothing to draw them from: state diagrams (there is no enum that is a state machine) and
# entity-relationship diagrams (there is no database). Switching them on without one would only be a warning.
architecture:
  title: Package overview
  section: architecture
  order: 10
  rootPackage: dev.doctize
  external: true
  # The known cycle between config, hosting, output, render, search and site is described in the guide. Reporting it would fail the
  # build, which fails on warnings, so it is not looked for here.
  cycles: false
  # These hold today, and ArchitectureIntegrationTest checks them too.
  forbid:
    - from: dev.doctize.license.**
      to: dev.doctize.**
      reason: Licensing stands alone, so that it can be read and audited on its own.
    - from: dev.doctize.model.**
      to: dev.doctize.**
      reason: The model is the hand-over format between the processor and the generator.
    - from: dev.doctize.text.**
      to: dev.doctize.**
      reason: Text utilities are the bottom of the code.
  diagrams:
    overview:
      # The root package holds the builder and DoctizeException, which almost every package refers to: shown, it would be a hub that
      # hides the structure. It is left out of the overview only; the flow charts start in it. The guide explains it.
      exclude: ["dev.doctize"]
    classes:
      title: Class diagrams
      maxClasses: 40
      # The public API and the data of the types, without their private state.
      fieldVisibility: protected
      # The types that the pipeline is made of. The rest is in the API reference.
      includeTypes:
        - dev.doctize.Doctize.**
        - dev.doctize.GenerationReport
        - dev.doctize.DoctizeException
        - dev.doctize.site.**
        - dev.doctize.model.**
        - dev.doctize.config.**
        - dev.doctize.license.**
        - dev.doctize.architecture.**
    flows:
      title: Flows
      # Left to right: a method with many calls is a tall chart, which reads better than a wide one.
      direction: left-right
      depth: 3
      maxNodes: 45
      entryPoints:
        - method: dev.doctize.Doctize#generate
          name: Generate a site
          depth: 1
          description: What happens between Doctize.generate() and the files on disk. The steps of the pipeline in How it works, as calls.
        - method: dev.doctize.cli.GenerateCommand#call
          name: The generate command
          depth: 1
          description: What the doctize generate command does before it hands over to the generator, and after.
        - method: dev.doctize.processor.DocProcessor#process
          name: Extract the model while compiling
          depth: 2
          description: What the annotation processor does inside javac, round by round, until it writes model.json.
        - method: dev.doctize.gradle.DoctizeGenerate#generate
          name: Generate a site from Gradle
          depth: 2
          description: What the generateDocs task of the Gradle plugin does; the tool itself runs in a separate process.
        - method: dev.doctize.license.LicenseStatus#of
          name: Check a license
          description: How a license is found, and checked without a network connection.
        - method: dev.doctize.architecture.ArchitecturePageSource#pages
          name: Make the architecture diagrams
          depth: 2
          description: From the class files to the pages of this section.

# Published with GitHub Pages. The address, https://exleonem.github.io/doctize/, is derived from project.repository.
hosting:
  githubPages: true
