# Publishes a release to Maven Central and creates the GitHub release.
#
# Trigger: push a tag "v<version>", where <version> is the `version` in gradle.properties.
# Required repository secrets, see RELEASING.md:
#   SIGNING_KEY, SIGNING_PASSWORD               the PGP key that signs the artifacts
#   CENTRAL_PORTAL_USERNAME, CENTRAL_PORTAL_PASSWORD   a user token of the Maven Central Portal
#   GRADLE_PUBLISH_KEY, GRADLE_PUBLISH_SECRET   an API key of the Gradle Plugin Portal
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (Settings → Environments) to gate releases.
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4

      - name: The tag must match the version of the project
        run: |
          version=$(grep -E '^version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in gradle.properties"
            exit 1
          fi
          case "$version" in *SNAPSHOT*) echo "::error::Snapshots cannot be released"; exit 1;; esac
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: The changelog must describe this version
        run: grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }

      # Everything, with the signing key, so that the checks of the signatures are not skipped.
      - name: Build, test and create the signed bundle
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew build centralBundle --stacktrace

      # USER_MANAGED: the upload waits in the Portal until you press "Publish". Set the repository variable
      # CENTRAL_PUBLISHING_TYPE to AUTOMATIC to release without that step.
      - name: Upload to Maven Central
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: ./gradlew publishToCentralPortal -PcentralPublishingType=${{ vars.CENTRAL_PUBLISHING_TYPE || 'USER_MANAGED' }}

      # The Gradle plugin also goes to the Gradle Plugin Portal, where Gradle finds plugins without any configuration.
      # Unlike an upload to Central, this publishes immediately.
      - name: Publish the Gradle plugin to the Gradle Plugin Portal
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :doctize-gradle-plugin:publishPlugins --stacktrace

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Doctize $VERSION" \
            --notes-file release-notes.md \
            "doctize-cli/build/distributions/doctize-$VERSION.zip" \
            "build/central/doctize-$VERSION-central-bundle.zip"
