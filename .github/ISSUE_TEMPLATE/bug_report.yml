name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: A minimal annotated class and, if relevant, the guide or `doctize.yml`.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Doctize version
      description: The output of `doctize --version`.
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version and operating system
