# Publishes the documentation of Doctize, generated by Doctize, to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - id: pages
        uses: actions/configure-pages@v5
      # With the repository secret DOCTIZE_LICENSE (a license of Doctize, see RELEASING.md) the site also gets the live architecture map.
      # Without it the secret is empty, and the site is built without that page.
      - name: Generate the documentation
        env:
          DOCTIZE_LICENSE: ${{ secrets.DOCTIZE_LICENSE }}
        run: ./gradlew :doctize-docs:generateDocs -PdoctizeArgs="--github-pages --base-url ${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doctize-docs/build/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
